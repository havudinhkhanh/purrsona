<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Purrsona</title>
<style>
  @font-face{font-family:"Patrick Hand";src:url(fonts/ph-vietnamese-400.woff2) format("woff2");unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+1EA0-1EF9}
  @font-face{font-family:"Patrick Hand";src:url(fonts/ph-latin-400.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  body{margin:0;width:300px;box-sizing:border-box;padding:16px 16px 14px;background:#F3F0E8;color:#1d1d1f;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font:400 26px/1 "Patrick Hand","Comic Neue",ui-rounded,cursive;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  h1 svg{width:34px;height:34px}
  p{margin:0 0 12px;color:#555;font-size:12.5px}
  label{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1.5px dashed #bbb}
  input[type=checkbox]{accent-color:#1d1d1f;width:16px;height:16px}
  .n{font:400 22px "Patrick Hand",cursive}
  .btn{display:block;width:100%;margin-top:12px;padding:10px;border:2px solid #1d1d1f;border-radius:12px 14px 11px 13px;background:#1d1d1f;color:#F3F0E8;font:400 18px "Patrick Hand",cursive;text-align:center;cursor:pointer;text-decoration:none;box-sizing:border-box}
  .ghost{background:none;color:#1d1d1f}
  input[type=url]{width:100%;box-sizing:border-box;margin-top:4px;padding:6px 8px;border:1.5px solid #888;border-radius:8px;background:#fff;font:12px system-ui}
  small{color:#777;font-size:11px;display:block;margin-top:10px}
  ul{list-style:none;margin:6px 0 0;padding:0;max-height:120px;overflow:auto}li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px}li i{color:#888;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
</style></head>
<body>
  <h1><span id="cat"></span>Purrsona</h1>
  <p>Mèo đọc ké. Gạch dưới chữ đã học, rê vào ra nghĩa, bôi đen là lưu.</p>
  <label>Mèo ngồi trên các trang <input type="checkbox" id="on"></label>
  <label>Gạch dưới chữ đã học <input type="checkbox" id="hl"></label>
  <label id="siteRow"><span>Ẩn mèo trên <b id="site">trang này</b></span><input type="checkbox" id="skip"></label>
  <label>Chờ gửi vào sổ <span class="n" id="cnt">0</span></label>
  <ul id="list"></ul>
  <a class="btn" id="open" target="_blank" rel="noopener">Mở app để đồng bộ sổ</a>
  <button class="btn ghost" id="exp">Tải danh sách đã lưu (.csv)</button>
  <small>Địa chỉ app<input type="url" id="url"></small>
  <small>Mọi thứ xử lý trong máy. Tiện ích không gửi nội dung trang đi đâu. Biết <span id="kn">0</span> từ bạn đã học (đồng bộ khi mở app).</small>
  <script src="poses.js"></script>
  <script src="popup.js"></script>
</body></html>
